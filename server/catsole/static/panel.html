<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catsole</title>
<style>
  :root {
    --ink: #16191d;         /* page: graphite, lighter than the screen */
    --glass: #06080a;       /* the OLED itself: darkest thing on the page */
    --rule: #2b3037;
    --text: #c8ccd2;
    --dim: #6b747f;
    --phosphor: #b8e8ff;    /* what a blue/white SSD1309 actually emits */
    --amber: #e8a23d;       /* stale link only */
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono",
            ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 16px 56px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .link-state {
    color: var(--dim);
    font-size: 12px;
    white-space: nowrap;
  }

  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 6px;
    background: var(--dim);
    vertical-align: middle;
  }
  .dot.up { background: var(--phosphor); }
  .dot.down { background: var(--amber); }

  /* The preview is the hero: real 128x64 pixels, scaled with hard edges. */
  .screen {
    margin: 26px 0 22px;
    padding: 14px;
    background: var(--glass);
    border: 1px solid var(--rule);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 1;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }

  /* Buttons invert the way a 1-bit selection does, not the way a pill does. */
  button {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 5px 14px;
    cursor: pointer;
    border-radius: 0;
  }
  button:hover { border-color: var(--dim); }
  button:focus-visible {
    outline: 2px solid var(--phosphor);
    outline-offset: 2px;
  }
  button[aria-pressed="true"] {
    background: var(--phosphor);
    border-color: var(--phosphor);
    color: var(--glass);
  }

  dl {
    margin: 0;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 0;
  }

  dt, dd {
    margin: 0;
    padding: 7px 0;
    border-top: 1px solid var(--rule);
  }
  dt { color: var(--dim); }
  dd { text-align: right; font-variant-numeric: tabular-nums; }

  .muted { color: var(--dim); }

  .lab-title {
    margin: 34px 0 2px;
    font-size: 13px;
    font-weight: 600;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .lab-sub { margin: 0 0 14px; color: var(--dim); font-size: 12px; }

  .note {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    color: var(--dim);
    font-size: 12px;
  }

  @media (max-width: 420px) {
    dl { grid-template-columns: 76px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>catsole</h1>
    <div class="link-state"><span class="dot" id="dot"></span><span id="linkText">connecting</span></div>
  </header>

  <div class="screen">
    <canvas id="oled" width="128" height="64" role="img"
            aria-label="Live preview of the device display"></canvas>
  </div>

  <div class="controls">
    <button data-mode="lyrics" aria-pressed="false">lyrics</button>
    <button data-mode="stats" aria-pressed="false">stats</button>
    <button data-mode="clock" aria-pressed="false">clock</button>
    <button id="btn-refresh">refresh now</button>
  </div>

  <dl>
    <dt>playing</dt><dd id="v-track" class="muted">nothing yet</dd>
    <dt>position</dt><dd id="v-pos" class="muted">--</dd>
    <dt>lyrics</dt><dd id="v-lyr" class="muted">--</dd>
    <dt>cpu</dt><dd id="v-cpu" class="muted">--</dd>
    <dt>gpu</dt><dd id="v-gpu" class="muted">--</dd>
    <dt>ram</dt><dd id="v-ram" class="muted">--</dd>
  </dl>

  <p class="note" id="note">Switch modes with the buttons above.</p>

  <h2 class="lab-title">lab</h2>
  <p class="lab-sub">Preview screens and animations without touching the device.</p>

  <div class="controls">
    <button data-scene="boot">boot</button>
    <button data-scene="idle">idle</button>
    <button data-scene="lyrics">lyrics</button>
    <button data-scene="clock">clock</button>
    <button data-scene="stats">stats</button>
    <button data-scene="stale">no link</button>
    <button data-scene="poses">poses</button>
  </div>

  <div class="screen">
    <canvas id="lab" width="128" height="64" role="img"
            aria-label="Animation preview"></canvas>
  </div>


</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("oled");
  var ctx = canvas.getContext("2d");
  var W = 128, H = 64;

  var PHOSPHOR = "#b8e8ff";
  var AMBER = "#e8a23d";
  var GLASS = "#06080a";

  var state = null;
  var lastOk = 0;
  var marquee = 0;
  var eq = [];
  var eqPhase = [];
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 43 bars at 2px with 1px gaps fills exactly 128px, matching the firmware.
  var EQ_BARS = 43, EQ_BAR_W = 2, EQ_GAP = 1, EQ_ROW_H = 12;
  // Where the mascot perches, and how far the stats bars stop short.
  var CAT_PERCH_X = 96, STAT_BAR_W = 100;
  for (var i = 0; i < EQ_BARS; i++) { eq.push(1); eqPhase.push(Math.random() * 6.28); }

  // Lyric slide transition, mirroring the firmware.
  var TRANS_MS = 260;
  var lastMain = null, prevMain = "", transStart = 0;

  function fmtTime(ms) {
    if (!ms && ms !== 0) return "--";
    var total = Math.floor(ms / 1000);
    var m = Math.floor(total / 60);
    var s = total % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function num(v, digits) {
    if (v === null || v === undefined) return "--";
    return digits ? v.toFixed(digits) : String(Math.round(v));
  }

  // ---- canvas: mirror what the firmware draws -------------------------

  function clear() {
    ctx.fillStyle = GLASS;
    ctx.fillRect(0, 0, W, H);
  }

  function textWidth(text, font) {
    ctx.font = font;
    return ctx.measureText(text).width;
  }

  function drawMarquee(text, y, font, color, boxW) {
    ctx.font = font;
    ctx.fillStyle = color;
    var w = ctx.measureText(text).width;
    if (w <= boxW) {
      ctx.fillText(text, 2, y);
      return;
    }
    var gap = 14;
    var span = w + gap;
    var offset = marquee % span;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y - 8, boxW + 2, 12);
    ctx.clip();
    ctx.fillText(text, 2 - offset, y);
    ctx.fillText(text, 2 - offset + span, y);
    ctx.restore();
  }

  function drawEqualizer(active) {
    for (var i = 0; i < eq.length; i++) {
      if (active && !reduceMotion) {
        // Travelling wave: two sines offset by bar index, so neighbours
        // stay related and the row reads as one sweep across the screen.
        var t = Date.now() / 240;
        var x = i * 0.34 + eqPhase[i] * 0.02;
        var v = Math.abs(Math.sin(t + x)) * 0.62
              + Math.abs(Math.sin(t * 0.47 + x * 1.9)) * 0.38;
        eq[i] += ((1 + v * (EQ_ROW_H - 1)) - eq[i]) * 0.28;
      } else {
        eq[i] += (1 - eq[i]) * 0.12;   // decay to a flat line when idle
      }
      var h = Math.min(EQ_ROW_H, Math.max(1, Math.round(eq[i])));
      ctx.fillStyle = PHOSPHOR;
      ctx.fillRect(i * (EQ_BAR_W + EQ_GAP), H - h, EQ_BAR_W, h);
    }
  }

  function drawMainText(text, yShift) {
    if (!text) return;
    ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = PHOSPHOR;
    var words = text.split(" ");
    var lines = [], cur = "";
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + " " + words[i] : words[i];
      if (ctx.measureText(test).width > CAT_PERCH_X - 6 && cur) { lines.push(cur); cur = words[i]; }
      else { cur = test; }
    }
    if (cur) lines.push(cur);
    lines = lines.slice(0, 3);
    var y = lines.length > 1 ? 26 : 32;
    for (var j = 0; j < lines.length; j++) {
      ctx.fillText(lines[j], 2, y + j * 12 + yShift);
    }
  }

  function drawBar(x, y, w, h, pct) {
    ctx.strokeStyle = PHOSPHOR;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (pct === null || pct === undefined) return;
    var fill = Math.max(0, Math.min(1, pct / 100)) * (w - 4);
    ctx.fillStyle = PHOSPHOR;
    ctx.fillRect(x + 2, y + 2, fill, h - 4);
  }

  function drawLyrics(frame, levels) {
    var meta = frame.meta || "";
    var main = frame.main || "";

    drawMarquee(meta, 8, "7px " + getComputedStyle(document.body).fontFamily, PHOSPHOR, W - 4);

    ctx.fillStyle = PHOSPHOR;
    ctx.fillRect(0, 11, W, 1);

    if (frame.state === "idle") {
      ctx.font = "8px " + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = PHOSPHOR;
      ctx.fillText("nothing playing", 2, 34);
    } else if (main) {
      if (main !== lastMain) {
        prevMain = (lastMain === null) ? "" : lastMain;
        lastMain = main;
        transStart = Date.now();
      }
      var since = Date.now() - transStart;
      if (since < TRANS_MS && !reduceMotion) {
        var pr = since / TRANS_MS, q = 1 - pr, eased = 1 - q * q * q;
        var travel = 36;
        ctx.save();
        ctx.beginPath(); ctx.rect(0, 14, W, 36); ctx.clip();
        drawMainText(prevMain, -eased * travel);
        drawMainText(main, (1 - eased) * travel);
        ctx.restore();
      } else {
        drawMainText(main, 0);

      }
    }

    drawEqualizer(frame.state === "playing" && frame.eq === 1);

    // The cat stands in front of the bars: the equalizer is decoration,
    // so occluding its right end costs nothing.
    ctx.fillStyle = GLASS;
    // Hop on detected beats, mirroring the firmware.
    var playing = frame.state === "playing";
    var bass = 0;
    if (playing && levels && levels.length >= 3) {
      bass = (levels[0] + levels[1] + levels[2]) / 3 / 15;
    }
    bassAvg += (bass - bassAvg) * 0.04;
    var nowMs = Date.now();
    if (bass > bassAvg * 1.30 && bass > 0.22 && nowMs - lastHopMs > 190) {
      hop = 1; lastHopMs = nowMs;
    }
    hop *= 0.86;
    var lift = Math.round(hop * 4);

    ctx.fillStyle = GLASS;
    ctx.fillRect(CAT_PERCH_X - 3, 43, W - CAT_PERCH_X + 3, H - 43);
    drawCatArt(CAT[hop > 0.5 ? 2 : labPose(playing, false)],
               CAT_PERCH_X, 55 - lift, 6, 7, ctx, 4);
  }

  function pairGBWhole(used, total) {
    if (used === null || used === undefined || !total) return "--";
    return Math.round(used / 1024) + "/" + Math.round(total / 1024) + "GB";
  }

  function pairGB(used, total) {
    if (used === null || used === undefined || !total) return "--";
    return (used / 1024).toFixed(1) + "/" + (total / 1024).toFixed(1) + "GB";
  }

  function statRow(baseline, label, value, load) {
    ctx.font = mono(7);
    ctx.fillStyle = PHOSPHOR;
    ctx.fillText(label, 2, baseline);
    ctx.fillText(value, 24, baseline);
    drawBar(2, baseline + 2, STAT_BAR_W, 6, load);
  }

  function drawStats(frame) {
    var cpu = frame.cpu || {}, gpu = frame.gpu || {}, ram = frame.ram || {};
    var fans = frame.fans || [];
    var fastest = 0;
    fans.forEach(function (f) { if (f.rpm > fastest) fastest = f.rpm; });

    ctx.font = mono(7);
    ctx.fillStyle = PHOSPHOR;
    ctx.fillText("system", 2, 8);
    // Fan speed rides in the header: a bar would imply a percentage.
    ctx.fillText(fans.length ? "fan " + fastest + "rpm" : "fan --", 52, 8);
    ctx.fillRect(0, 11, W, 1);

    statRow(24, "cpu",
      num(cpu.temp) + (cpu.temp === null || cpu.temp === undefined ? "" : "C") + "  " +
      (cpu.clock ? (cpu.clock / 1000).toFixed(2) + "GHz" : "--"), cpu.load);
    statRow(40, "gpu",
      num(gpu.temp) + (gpu.temp === null || gpu.temp === undefined ? "" : "C") + "  " +
      pairGBWhole(gpu.vram_used, gpu.vram_total), gpu.load);
    statRow(56, "ram", pairGB(ram.used, ram.total), ram.percent);

    // Half a fan, centred on the right edge so the rest clips away.
    var cx = W, cy = 38, r = 21;
    if (!reduceMotion) spinFan += fastest > 0 ? (0.02 + (fastest / 2200) * 0.22) : 0.012;
    ctx.strokeStyle = PHOSPHOR; ctx.lineWidth = 1;
    [r, r - 4].forEach(function (rr) {
      ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, rr, 0, 6.2832); ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, 3, 0, 6.2832); ctx.fill();
    for (var i = 0; i < 5; i++) {
      var a = spinFan + i * 1.2566;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5);
      ctx.lineTo(cx + Math.cos(a + 0.5) * (r - 3), cy + Math.sin(a + 0.5) * (r - 3));
      ctx.stroke();
    }
  }

  function drawStale() {
    // Dither the whole frame down, the way the firmware XOR-dims it.
    ctx.fillStyle = GLASS;
    for (var y = 0; y < H; y++) {
      for (var x = (y % 2); x < W; x += 2) { ctx.fillRect(x, y, 1, 1); }
    }
    ctx.fillStyle = AMBER;
    ctx.fillRect(0, 0, 34, 9);
    ctx.fillStyle = GLASS;
    ctx.font = "7px " + getComputedStyle(document.body).fontFamily;
    ctx.fillText("no link", 3, 7);
  }

  function render() {
    clear();
    if (!reduceMotion) marquee += 0.4;

    if (!state || !state.frame) {
      ctx.fillStyle = PHOSPHOR;
      ctx.font = "8px " + getComputedStyle(document.body).fontFamily;
      ctx.fillText("waiting for service", 2, 34);
    } else if (state.frame.mode === "stats") {
      drawStats(state.frame);
    } else if (state.frame.mode === "clock") {
      drawClockScreen(ctx, state.frame);
    } else {
      drawLyrics(state.frame, state.audio && state.audio.levels);
    }

    if (state && Date.now() - lastOk > 5000) drawStale();

    requestAnimationFrame(render);
  }

  // ---- data ------------------------------------------------------------

  function setText(id, text, muted) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.classList.toggle("muted", !!muted);
  }

  function apply(data) {
    state = data;
    lastOk = Date.now();

    var connected = data.link && data.link.connected;
    document.getElementById("dot").className = "dot " + (connected ? "up" : "down");
    document.getElementById("linkText").textContent = connected
      ? (data.link.port || "connected")
      : "no device";

    document.querySelectorAll("button[data-mode]").forEach(function (btn) {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === data.mode));
    });

    var np = data.now_playing;
    if (np) {
      setText("v-track", (np.artist ? np.artist + " - " : "") + np.title, false);
      setText("v-pos", fmtTime(np.position_ms) + " / " + fmtTime(np.duration_ms), false);
    } else {
      setText("v-track", "nothing playing", true);
      setText("v-pos", "--", true);
    }

    setText("v-lyr", data.lyrics_kind === "synced" ? "synced"
      : data.lyrics_kind === "plain" ? "found, not timed"
      : "none found", data.lyrics_kind === "none");

    var cpu = data.stats.cpu || {}, gpu = data.stats.gpu || {};
    setText("v-cpu",
      num(cpu.temp, 0) + (cpu.temp === null ? "" : "°C") + "   " +
      (cpu.clock ? (cpu.clock / 1000).toFixed(2) + " GHz" : "--") + "   " +
      num(cpu.load, 0) + (cpu.load === null ? "" : "%"), false);
    var ram = data.stats.ram || {};
    setText("v-ram",
      (ram.used && ram.total)
        ? (ram.used / 1024).toFixed(1) + "/" + (ram.total / 1024).toFixed(1) + " GB   "
          + num(ram.percent, 0) + "%"
        : "--", !ram.total);

    setText("v-gpu",
      num(gpu.temp, 0) + (gpu.temp === null ? "" : "°C") + "   " +
      num(gpu.load, 0) + (gpu.load === null ? "" : "%") + "   " +
      ((gpu.vram_used && gpu.vram_total)
        ? (gpu.vram_used / 1024).toFixed(1) + "/" + (gpu.vram_total / 1024).toFixed(1) + " GB"
        : "--"), false);

    document.getElementById("note").textContent = connected
      ? (data.lhm ? "Switch modes with the buttons above."
                  : "CPU temperature needs LibreHardwareMonitor running. Everything else is live.")
      : "No device on any port. Check the cable, or start the service with --no-serial.";
  }

  function poll() {
    fetch("/api/state")
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () { /* service down; the stale treatment says so */ });
  }

  document.querySelectorAll("button[data-mode]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      fetch("/api/mode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: btn.dataset.mode })
      }).then(poll);
    });
  });

  document.getElementById("btn-refresh").addEventListener("click", function () {
    fetch("/api/refresh", { method: "POST" }).then(poll);
  });


  // ---- cover, clock and fan screens, mirroring the firmware ------------

  function drawProgressBar(c, frame) {
    if (!frame.dur) return;
    var pos = frame.pos || 0;
    var w = Math.round((pos / frame.dur) * (W - 4));
    if (w > 0) { c.fillStyle = PHOSPHOR; c.fillRect(2, 12, w, 2); }
  }

  var spinCover = 0, spinFan = 0, bop = 0;
  var bassAvg = 0, hop = 0, lastHopMs = 0;

  function drawClockScreen(c, frame) {
    if (!frame.time) return;
    drawCatArt(CAT[labPose(frame.state === "playing", false)], 98, 9, 6, 6, c, 4);

    c.fillStyle = PHOSPHOR;
    c.font = "24px " + getComputedStyle(document.body).fontFamily;
    c.fillText(frame.time, 4, 44);
    var w = c.measureText(frame.time).width;
    c.font = mono(10);
    c.fillText(frame.sec || "", 8 + w, 44);
    c.font = mono(7);
    c.fillText(frame.date || "", 5, 58);
  }

  // ---- lab: preview scenes and animations -----------------------------

  var labCanvas = document.getElementById("lab");
  var lx = labCanvas.getContext("2d");
  var scene = "boot";
  var sceneStart = Date.now();
  var catChoice = 0;

  // Mascot poses, mirroring the firmware. Index order matches CAT_ART there.
  var CAT = [
    [" /\\_/\\ ", "(=o.o=)"],
    [" /\\_/\\ ", "(=-.-=)"],
    [" /\\_/\\ ", "(=^.^=)"],
    [" /\\_/\\ ", "(=u.u=)"],
    [" /\\_/\\ ", "(=-.o=)"]
  ];
  var POSE_NAMES = ["idle", "blink", "music", "asleep", "squint"];

  // Boot art candidates. B and C are originals drawn with open contours.
  var BOOT_ART = [CAT[0]];

  function mono(px) {
    return px + "px " + getComputedStyle(document.body).fontFamily;
  }

  function drawCatArt(rows, x, y, px, lineH, target, advance) {
    var c = target || lx;
    c.font = mono(px);
    c.fillStyle = PHOSPHOR;
    // u8g2 faces advance a fixed number of pixels per character (5x7
    // advances 5, 6x12 advances 6). The browser font does not, so each
    // character is placed explicitly -- otherwise the preview shows a
    // narrower cat than the real panel draws.
    var adv = advance || Math.round(px * 0.72);
    for (var i = 0; i < rows.length; i++) {
      for (var j = 0; j < rows[i].length; j++) {
        c.fillText(rows[i].charAt(j), x + j * adv, y + i * lineH);
      }
    }
  }

  function labClear() {
    lx.fillStyle = GLASS;
    lx.fillRect(0, 0, 128, 64);
  }

  function labPose(playing, resting) {
    if (resting) return 3;
    var t = Date.now();
    if ((t % 4300) < 160) return 1;
    if ((t % 7100) < 130) return 1;
    if ((t % 11300) < 900) return 4;
    return playing ? 2 : 0;
  }

  // Replays the firmware's boot sequence on the same timeline.
  function sceneBoot(t) {
    var art = BOOT_ART[catChoice];
    var lineH = 11, px = 10;
    var w = art[0].length * (px * 0.6);
    var cx = Math.max(2, (128 - w) / 2);
    var restY = art.length > 3 ? 14 : 20;

    if (t < 120) { lx.fillStyle = PHOSPHOR; lx.fillRect(0, 0, 128, 64); return; }
    t -= 120;

    if (t < 650) {                       // rise, easing out
      var q = 1 - (t / 650), eased = 1 - q * q * q;
      var y = (64 + 14) - eased * ((64 + 14) - restY);
      drawCatArt(art, cx, y, px, lineH);
      return;
    }
    t -= 650;

    if (t < 690) {                       // two uneven blinks
      var blink = (t < 110) || (t > 280 && t < 370);
      var rows = (catChoice === 0 && blink) ? CAT[1] : art;
      drawCatArt(rows, cx, restY, px, lineH);
      return;
    }
    t -= 690;

    var title = "catsole";               // name types in
    var n = Math.min(title.length, Math.floor(t / 65) + 1);
    drawCatArt(n >= title.length && catChoice === 0 ? CAT[2] : art, cx, restY, px, lineH);
    lx.font = "600 " + mono(11).slice(4);
    lx.fillStyle = PHOSPHOR;
    var text = title.slice(0, n);
    lx.fillText(text, (128 - lx.measureText(text).width) / 2, 62);
  }

  function sceneIdle() {
    drawCatArt(CAT[labPose(false, false)], 6, 24, 10, 11);
    lx.font = mono(7);
    lx.fillStyle = PHOSPHOR;
    lx.fillText("nothing", 56, 34);
    lx.fillText("playing", 56, 44);
  }

  function scenePoses() {
    lx.font = mono(7);
    for (var i = 0; i < CAT.length; i++) {
      var col = (i % 3) * 43 + 2, row = Math.floor(i / 3) * 32;
      drawCatArt(CAT[i], col, row + 10, 7, 8, null, 5);
      lx.fillStyle = PHOSPHOR;
      lx.font = mono(6);
      lx.fillText(POSE_NAMES[i], col + 2, row + 30);
    }
  }

  function labRender() {
    labClear();
    var t = Date.now() - sceneStart;
    if (scene === "boot") sceneBoot(t % 3400);
    else if (scene === "idle") sceneIdle();
    else if (scene === "poses") scenePoses();
    else if (scene === "clock") {
      var n = new Date();
      drawClockScreen(lx, {
        time: ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2),
        sec: ("0" + n.getSeconds()).slice(-2),
        date: n.toDateString().slice(0, 10).toLowerCase(), state: "idle" });
    }
    else if (scene === "stats") {
      var f = { cpu: { temp: 61, load: 34, clock: 4850 },
                gpu: { temp: 68, load: 99, vram_used: 4211, vram_total: 16380 },
                ram: { used: 15398, total: 32214, percent: 47.8 } };
      var save = ctx; ctx = lx; drawStats(f); ctx = save;
    } else {
      var fr = { meta: "An Artist - A Rather Long Track Title",
                 main: "placeholder line for previewing the layout",
                 state: "playing", eq: 1, lyr: "synced" };
      var save2 = ctx; ctx = lx; drawLyrics(fr, null); ctx = save2;
      if (scene === "stale") {
        lx.fillStyle = GLASS;
        for (var y = 0; y < 64; y++)
          for (var x = (y % 2); x < 128; x += 2) lx.fillRect(x, y, 1, 1);
        lx.fillStyle = AMBER; lx.fillRect(0, 0, 34, 9);
        lx.fillStyle = GLASS; lx.font = mono(7);
        lx.fillText("no link", 3, 7);
      }
    }
    requestAnimationFrame(labRender);
  }

  document.querySelectorAll("button[data-scene]").forEach(function (b) {
    b.addEventListener("click", function () {
      scene = b.dataset.scene;
      sceneStart = Date.now();
      document.querySelectorAll("button[data-scene]").forEach(function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
    });
  });

  requestAnimationFrame(labRender);

  poll();
  setInterval(poll, 1000);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
